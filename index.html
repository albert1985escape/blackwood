<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - Proyecto Fénix</title>
    <style>
        /* Estilos anteriores se mantienen igual */
        body {
            font-family: monospace;
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 80%;
            max-width: 600px;
            padding: 20px;
            border: 2px solid red;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            border-radius: 5px;
        }

        h1 {
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
        }

        input[type="password"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            margin-bottom: 10px;
            width: 200px;
            background-color: black;
            color: white;
            font-family: monospace;
        }

        button {
            padding: 10px 20px;
            background-color: darkred;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            background-color: red;
        }

        #error-message {
            color: red;
            font-size: 2em;
            font-weight: bold;
            display: none;
        }

        #password-display {
            margin-top: 10px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ACCESO RESTRINGIDO</h1>
        <p>INGRESE CÓDIGO DE AUTORIZACIÓN:</p>
        <input type="password" id="password" placeholder="CÓDIGO" oninput="displayPassword()">
        <button onclick="checkPassword()">AUTORIZAR</button>
        <div id="error-message">ACCESO DENEGADO</div>
        <div id="password-display"></div>
    </div>

    <script>
        function checkPassword() {
            const password = document.getElementById("password").value.toUpperCase();
            
            // Código especial para abrir proyecto_fenix.html
            if (password === "FENIX") {
                window.location.href = "proyecto_fenix.html";
                return; // Termina la función si el código es correcto
            }

            // Generar códigos PF001-PF013 y PF001PC-PF013PC
            const workerCodes = [];
            const patientCodes = [];
            
            for (let i = 1; i <= 13; i++) {
                const num = i.toString().padStart(3, '0');
                workerCodes.push(`PF${num}`);
                patientCodes.push(`PF${num}PC`);
            }

            // Verificar códigos de trabajador
            if (workerCodes.includes(password)) {
                const workerNumber = password.replace('PF', '');
                window.location.href = `trabajador${workerNumber}.html`;
                return; // Termina la función si el código es correcto
            }

            // Verificar códigos de paciente
            if (patientCodes.includes(password)) {
                const patientNumber = password.replace('PF', '').replace('PC', '');
                window.location.href = `paciente${patientNumber}.html`;
                return; // Termina la función si el código es correcto
            }

            // Si no coincide ningún código
            document.getElementById("error-message").style.display = "block";
        }

        function displayPassword() {
            const password = document.getElementById("password").value.toUpperCase();
            document.getElementById("password-display").textContent = "CÓDIGO INGRESADO: " + password;
        }
    </script>
</body>
</html>
